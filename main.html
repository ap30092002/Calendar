<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="main.css">
</head>
<body class="bg-gray-100">
  <div class="container-fluid mt-5">
    <div class="row">
      <!-- Left Section -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-lg">
          <div class="card-header bg-blue-600 text-white">
            <h3 class="text-center" id="selectedDateHeader">Select a Date</h3>
          </div>
          <div class="card-body">
            <div id="eventsList"></div>
            <form id="eventForm" class="mt-4">
              <input type="time" id="eventTime" class="form-control mb-2" required>
              <input type="text" id="eventTitle" class="form-control mb-2" placeholder="Event Title" required>
              <button type="submit" class="btn btn-primary w-100">Add Event</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Right Section -->
      <div class="col-md-6">
        <!-- Calendar Card -->
        <div class="card shadow-lg mb-4">
          <div class="card-header bg-blue-600 text-white">
            <div class="d-flex justify-content-between align-items-center">
              <button id="prevMonth" class="btn btn-light">&lt;</button>
              <h3 class="text-center mb-0">
                <span id="calendarMonth"></span> <span id="calendarYear"></span>
              </h3>
              <button id="nextMonth" class="btn btn-light">&gt;</button>
            </div>
          </div>
          <div class="card-body">
            <!-- Days of Week -->
            <div class="grid grid-cols-7 text-center font-bold mb-2">
              <div>Sun</div>
              <div>Mon</div>
              <div>Tue</div>
              <div>Wed</div>
              <div>Thu</div>
              <div>Fri</div>
              <div>Sat</div>
            </div>
            <!-- Calendar Dates -->
            <div id="calendarDays" class="grid grid-cols-7 text-center gap-1"></div>
          </div>
        </div>
        <!-- Today's Events Card -->
        <div class="card shadow-lg">
          <div class="card-header bg-blue-600 text-white">
            <h3 class="text-center">Today's Events</h3>
          </div>
          <div class="card-body" id="todaysEvents"></div>
        </div>
      </div>
    </div>
    </div>
  <!-- JS module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { 
        getDatabase, 
        ref, 
        push, 
        query, 
        orderByChild, 
        startAt, 
        endAt, 
        onValue, 
        remove 
        } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

        // Firebase Config
        const firebaseConfig = {
        apiKey: "AIzaSyCb98OItW9qWVokmvE7U5fk_vdFm-XedmE",
        authDomain: "calendar-app-a2e38.firebaseapp.com",
        databaseURL: "https://calendar-app-a2e38-default-rtdb.firebaseio.com",
        projectId: "calendar-app-a2e38",
        storageBucket: "calendar-app-a2e38.firebasestorage.app",
        messagingSenderId: "183558476179",
        appId: "1:183558476179:web:da589bce5f523029c01866",
        measurementId: "G-VM06ZGWZK0"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const eventsRef = ref(database, 'events');

        // Add Event
        // Form handler
        document.getElementById('eventForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const title = document.getElementById('eventTitle').value;
        const time = document.getElementById('eventTime').value;
        
        if (!title || !time) {
            alert('Please fill all fields');
            return;
        }

        try {
            const db = getDatabase();
            await push(ref(db, 'events'), {
            title,
            time,
            date: selectedDate.toISOString()
            });
            console.log('Event added successfully');
            e.target.reset();
        } catch (error) {
            console.error('Firebase error:', error);
            alert('Error saving event');
        }
        });


        // Get Events for Selected Date
        function loadEventsForSelectedDate() {
        const startDate = new Date(selectedDate);
        startDate.setHours(0, 0, 0, 0);
        
        const endDate = new Date(selectedDate);
        endDate.setHours(23, 59, 59, 999);

        const eventsQuery = query(
            eventsRef,
            orderByChild('date'),
            startAt(startDate.toISOString()),
            endAt(endDate.toISOString())
        );

        onValue(eventsQuery, (snapshot) => {
            const eventsList = document.getElementById('eventsList');
            eventsList.innerHTML = '';
            
            if (snapshot.exists()) {
            snapshot.forEach((childSnapshot) => {
                const event = childSnapshot.val();
                eventsList.innerHTML += `
                <div class="event-item">
                    <span>${event.time} - ${event.title}</span>
                    <button class="btn btn-danger btn-sm" 
                    onclick="deleteEvent('${childSnapshot.key}')">×</button>
                </div>
                `;
            });
            } else {
            eventsList.innerHTML = '<p class="text-gray-500">No events for this day</p>';
            }
        });
        }

        // Get Today's Events
        function loadTodaysEvents() {
        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);
        
        const todayEnd = new Date();
        todayEnd.setHours(23, 59, 59, 999);

        const todayQuery = query(
            eventsRef,
            orderByChild('date'),
            startAt(todayStart.toISOString()),
            endAt(todayEnd.toISOString())
        );

        onValue(todayQuery, (snapshot) => {
            const todaysEvents = document.getElementById('todaysEvents');
            todaysEvents.innerHTML = '';
            
            if (snapshot.exists()) {
            snapshot.forEach((childSnapshot) => {
                const event = childSnapshot.val();
                todaysEvents.innerHTML += `
                <div class="event-item">
                    ${event.time} - ${event.title}
                </div>
                `;
            });
            } else {
            todaysEvents.innerHTML = '<p class="text-gray-500">No events today</p>';
            }
        });
        }

        // Delete Event
        window.deleteEvent = (eventId) => {
        const eventRef = ref(database, `events/${eventId}`);
        remove(eventRef);
        };

        // DOM Elements
        const calendarMonth = document.getElementById('calendarMonth');
        const calendarYear = document.getElementById('calendarYear');
        const calendarDays = document.getElementById('calendarDays');
        const prevMonthBtn = document.getElementById('prevMonth');
        const nextMonthBtn = document.getElementById('nextMonth');
        const selectedDateHeader = document.getElementById('selectedDateHeader');
        const eventsList = document.getElementById('eventsList');
        const todaysEvents = document.getElementById('todaysEvents');

        // Date State
        let today = new Date();
        let selectedDate = new Date(today);
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();

        // Helper: Format date as YYYY-MM-DD
        function formatDate(date) {
        return date.toISOString().split('T')[0];
        }

        // Render the calendar grid
        function renderCalendar(month, year) {
        // Set month and year labels
        calendarMonth.textContent = new Date(year, month).toLocaleString('default', { month: 'long' });
        calendarYear.textContent = year;

        // Clear previous days
        calendarDays.innerHTML = '';

        // Get first day of month (0=Sun, 6=Sat)
        const firstDay = new Date(year, month, 1).getDay();
        // Get number of days in month
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Empty slots for days before the 1st
        for (let i = 0; i < firstDay; i++) {
        calendarDays.innerHTML += `<div></div>`;
        }

        // Days of the month
        for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const isToday = formatDate(date) === formatDate(today);
        const isSelected = formatDate(date) === formatDate(selectedDate);

        calendarDays.innerHTML += `
            <div 
            class="${isToday ? 'today' : ''} ${isSelected ? 'selected-day' : ''} py-2"
            data-date="${date.toISOString()}">
            <div class="font-semibold">${day}</div>
            </div>
        `;
        }

        // Click listener for day selection
        document.querySelectorAll('#calendarDays div[data-date]').forEach(div => {
        div.addEventListener('click', () => {
            selectedDate = new Date(div.dataset.date);
            renderCalendar(currentMonth, currentYear);
            updateSelectedDateHeader();
            loadEventsForSelectedDate();
        });
        });
        }

        // Updates the left section header with the selected date
        function updateSelectedDateHeader() {
        selectedDateHeader.textContent = selectedDate.toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });
        }

        // Month navigation
        prevMonthBtn.addEventListener('click', () => {
        currentMonth--;
        if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
        }
        renderCalendar(currentMonth, currentYear);
        });

        nextMonthBtn.addEventListener('click', () => {
        currentMonth++;
        if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
        }
        renderCalendar(currentMonth, currentYear);
        });

        // Initial render
        renderCalendar(currentMonth, currentYear);
        loadTodaysEvents();

    </script>
    <script src="main.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
