<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="main.css">
</head>
<body class="bg-gray-100">
  <div class="container-fluid mt-5">
    <div class="row">
      <!-- Left Section -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-lg">
          <div class="card-header bg-blue-600 text-white">
            <h3 class="text-center" id="selectedDateHeader">Select a Date</h3>
          </div>
          <div class="card-body">
            <div id="eventsList"></div>
            <form id="eventForm" class="mt-4">
              <input type="time" id="eventTime" class="form-control mb-2" required>
              <input type="text" id="eventTitle" class="form-control mb-2" placeholder="Event Title" required>
              <button type="submit" class="btn btn-primary w-100">Add Event</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Right Section -->
      <div class="col-md-6">
        <!-- Calendar Card -->
        <div class="card shadow-lg mb-4">
          <div class="card-header bg-blue-600 text-white">
            <div class="d-flex justify-content-between align-items-center">
              <button id="prevMonth" class="btn btn-light">&lt;</button>
              <h3 class="text-center mb-0">
                <span id="calendarMonth"></span> <span id="calendarYear"></span>
              </h3>
              <button id="nextMonth" class="btn btn-light">&gt;</button>
            </div>
          </div>
          <div class="card-body">
            <!-- Days of Week -->
            <div class="grid grid-cols-7 text-center font-bold mb-2">
              <div>Sun</div>
              <div>Mon</div>
              <div>Tue</div>
              <div>Wed</div>
              <div>Thu</div>
              <div>Fri</div>
              <div>Sat</div>
            </div>
            <!-- Calendar Dates -->
            <div id="calendarDays" class="grid grid-cols-7 text-center gap-1"></div>
          </div>
        </div>
        <!-- Today's Events Card -->
        <div class="card shadow-lg">
          <div class="card-header bg-blue-600 text-white">
            <h3 class="text-center">Today's Events</h3>
          </div>
          <div class="card-body" id="todaysEvents"></div>
        </div>
      </div>
    </div>
    </div>
  <!-- JS module -->
    <script type="module" src="https://drive.google.com/file/d/10EpwH4KUxk1KFehNK1ffcEPljdkQhwCl/view?usp=sharing"></script>
    <script src="main.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
